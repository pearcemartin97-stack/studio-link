<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f2433">
<title>AI Studio</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1f2433;color:#e8eaf0;
font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
main{padding:24px;max-width:420px}h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#b8bdcc}
a{color:#9db4ff}small{color:#7d8396}
</style></head><body><main>
<h1>AI Studio</h1><p id="msg">Opening your studio&hellip;</p><small id="when"></small>
</main>
<script>
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64url = s => b64(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
async function hmacKey(raw) { return crypto.subtle.importKey("raw", raw, {name: "HMAC", hash: "SHA-256"}, false, ["sign"]); }
async function mac(key, data) { return new Uint8Array(await crypto.subtle.sign("HMAC", key, data)); }
const enc = new TextEncoder();
const cat = (a, b) => { const r = new Uint8Array(a.length + b.length); r.set(a); r.set(b, a.length); return r; };
async function openLink(keyText, LINK) {
  const root = await hmacKey(b64url(keyText));
  const encKey = await hmacKey(await mac(root, enc.encode("studio-link enc")));
  const macKey = await hmacKey(await mac(root, enc.encode("studio-link mac")));
  const n = b64(LINK.n), c = b64(LINK.c), t = b64(LINK.t);
  const want = await mac(macKey, cat(n, c));
  if (want.length !== t.length || want.some((v, i) => v !== t[i])) return null;
  const out = new Uint8Array(c.length);
  for (let i = 0; i * 32 < c.length; i++) {
    const ctr = new Uint8Array([i >>> 24, (i >>> 16) & 255, (i >>> 8) & 255, i & 255]);
    const block = await mac(encKey, cat(n, ctr));
    for (let j = 0; j < 32 && i * 32 + j < c.length; j++) out[i * 32 + j] = c[i * 32 + j] ^ block[j];
  }
  return new TextDecoder().decode(out);
}
(async () => {
  const msg = document.getElementById("msg");
  let LINK = null;
  try {   // the link lives in link.json, read fresh every time, so a cached copy of this page never opens an old link
    const r = await fetch("link.json?t=" + Date.now(), {cache: "no-store"});
    if (r.ok) LINK = await r.json();
  } catch (e) {}
  if (LINK && LINK.updated) document.getElementById("when").textContent = "Link updated " + LINK.updated;
  if (LINK && !LINK.c) LINK = null;
  let k = new URLSearchParams(location.hash.slice(1)).get("k") || "";
  try { if (k) localStorage.setItem("studio_k", k); else k = localStorage.getItem("studio_k") || ""; } catch (e) {}
  if (!LINK) { msg.textContent = "The studio is offline right now. It updates this page by itself when it starts again."; return; }
  if (!k) { msg.textContent = "Open this page from the link your studio sent to your phone (it carries the key)."; return; }
  let url = null;
  try { url = await openLink(k, LINK); } catch (e) {}
  if (!url || !/^https:\/\//.test(url)) { msg.textContent = "This key doesn't match. Open the newest link your studio sent to your phone."; return; }
  msg.innerHTML = 'Opening your studio&hellip; <br><a href="' + url.replace(/"/g, "") + '">Tap here if nothing happens</a>';
  location.replace(url);
})();
</script></body></html>
